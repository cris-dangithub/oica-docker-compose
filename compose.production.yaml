services:
  db:
    mem_limit: 1g
  redis:
    mem_limit: 256m
    command: [redis-server, --appendonly, 'yes', --maxmemory, 192mb, --maxmemory-policy, noeviction]
  backend:
    mem_limit: 1g
  celery_worker:
    cpus: 2
    mem_limit: 4g
  frontend:
    mem_limit: 1g
  nginx:
    mem_limit: 128m
    ports:
      - '443:443'
    volumes:
      - ./config/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/tls-http.conf:/etc/nginx/conf.d/http.conf:ro
      - ${OICA_SHARED_DIR:?}/letsencrypt:/etc/letsencrypt:ro
      - ${OICA_SHARED_DIR:?}/acme:/var/www/certbot:ro
    healthcheck:
      test: [CMD, wget, -q, --no-check-certificate, --spider, https://127.0.0.1/api/health]
  certbot:
    image: certbot/certbot:v4.0.0
    profiles: [tls]
    volumes:
      - ${OICA_SHARED_DIR:?}/letsencrypt:/etc/letsencrypt
      - ${OICA_SHARED_DIR:?}/acme:/var/www/certbot
