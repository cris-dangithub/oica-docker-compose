name: ${COMPOSE_PROJECT_NAME:-oica}

x-python-env: &python-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-oica_user}:${POSTGRES_PASSWORD:-oica_local_password}@db:5432/${POSTGRES_DB:-oica_db}
  REDIS_URL: redis://redis:6379/0
  UPLOAD_PATH: /usr/src/app/data/filestore
  MPLBACKEND: Agg

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oica_db}
      POSTGRES_USER: ${POSTGRES_USER:-oica_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oica_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  migrate:
    image: ${BACKEND_IMAGE:-oica-backend:local}
    build:
      context: .
      dockerfile: config/backend/Dockerfile
    environment: *python-env
    command: [python, scripts/migrate.py]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    logging: *logging
  backend:
    image: ${BACKEND_IMAGE:-oica-backend:local}
    build:
      context: .
      dockerfile: config/backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *python-env
      SECRET_KEY: ${SECRET_KEY:-solo-desarrollo-cambiar-en-produccion}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      FLASK_DEBUG: 'False'
    volumes:
      - filestore:/usr/src/app/data/filestore
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  celery_worker:
    image: ${WORKER_IMAGE:-oica-worker:local}
    build:
      context: .
      dockerfile: config/celery_worker/Dockerfile
    command: [python, -m, celery, -A, celery_worker.celery, worker, --loglevel=info, '--concurrency=${WORKER_CONCURRENCY:-1}', '--hostname=oica@%h']
    restart: unless-stopped
    stop_grace_period: 10s
    environment: *python-env
    volumes:
      - filestore:/usr/src/app/data/filestore
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'python -m celery -A celery_worker.celery inspect ping -d "oica@$$HOSTNAME" --timeout=5']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: *logging
  frontend:
    image: ${FRONTEND_IMAGE:-oica-frontend:local}
    build:
      context: .
      dockerfile: config/frontend/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MAINTENANCE_DIR:-./.maintenance}:/maintenance:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/api/health]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  filestore:
