name: Publicar producción
on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      action:
        description: 'Actualizar o reconstruir borrando los datos de OICA'
        type: choice
        options: [deploy, reset]
        default: deploy
      confirmation:
        description: 'Para reset: BORRAR OICA PRODUCTION'
        type: string
        default: ''
      backup:
        description: 'Crear respaldo antes del borrado (las actualizaciones siempre respaldan)'
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
concurrency:
  group: oica-production
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validar operación
        env:
          ACTION: ${{ inputs.action || 'deploy' }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = refs/heads/production
          if [ "$ACTION" = reset ]; then test "$CONFIRMATION" = 'BORRAR OICA PRODUCTION'; fi
  verify:
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      publish: true
      rebuild: ${{ inputs.action == 'reset' }}
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
      - name: Instalar credencial SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Transferir y actualizar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          OICA_ROOT: ${{ vars.OICA_ROOT || '/opt/oica' }}
          ACTION: ${{ inputs.action || 'deploy' }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP: ${{ github.event_name == 'push' && 'true' || inputs.backup && 'true' || 'false' }}
        run: ./scripts/remote-deploy.sh "$GITHUB_SHA-$GITHUB_RUN_ID"
