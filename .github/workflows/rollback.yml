name: Recuperar versión anterior
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Identificador SHA-RUN_ID de una entrega conservada en la VPS'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: oica-production
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar entrega compatible
        env:
          SHA: ${{ inputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          OICA_ROOT: ${{ vars.OICA_ROOT || '/opt/oica' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test "$GITHUB_REF" = refs/heads/production
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ACTION=rollback ./scripts/remote-deploy.sh "$SHA"
