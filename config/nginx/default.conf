# Web, API y Socket.IO comparten origen.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=uploads:10m rate=6r/m;
server {
    listen 80;
    server_name _;
    client_max_body_size 16m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api backend:5000;
    set $web frontend:3000;
    location = /api { return 308 /api/; }
    location ~ ^/api/(upload|reprocess/[^/]+)$ {
        if (-f /maintenance/enabled) { return 503; }
        limit_req zone=uploads burst=5 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        if (-f /maintenance/enabled) { return 503; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
        if (-f /maintenance/enabled) { return 503; }
        proxy_pass http://$api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location / {
        if (-f /maintenance/enabled) { return 503; }
        proxy_pass http://$web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
    }
}
